[project]
name = "qemu-mcp"
version = "0.1.0"
description = "Local Linux MCP controller for existing libvirt QEMU domains: lifecycle, screenshots and input."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0xmortuex" }]
requires-python = ">=3.10"
dependencies = ["mcp>=2.3.0", "pillow>=10.0", "libvirt-python>=9.0; sys_platform == 'linux'"]
keywords = ["mcp", "qemu", "libvirt", "virtual-machine", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Emulators",
]

[project.optional-dependencies]
test = ["pytest>=7", "ruff==0.16.0", "mypy==2.3.0"]

[project.urls]
Homepage = "https://github.com/0xmortuex/qemu-mcp"

[project.scripts]
qemu-mcp = "qemu_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qemu_mcp"]

[tool.ruff.lint]
# Pinned explicitly so a ruff upgrade can't silently change what "default" means
# out from under CI (0.16.0 started flagging SIM/RUF checks that 0.15.8 didn't).
# This is ruff's own documented default subset (pyflakes + pycodestyle errors).
select = ["E4", "E7", "E9", "F"]
