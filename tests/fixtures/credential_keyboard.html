<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>QEMU credential keyboard test</title>
<style>
  body { margin: 0; background: #f5f6fa; color: #142033; font: 20px Arial; }
  h1 { position: absolute; left: 100px; top: 30px; font-size: 26px; }
  #status { position: absolute; left: 100px; top: 105px; }
  button { position: absolute; width: 80px; height: 45px; border: 1px solid #778399;
    border-radius: 4px; background: white; color: #142033; font: 22px Arial;
    padding: 0; outline: none; box-shadow: none; }
  button:hover { background: #e5ecfa; }
</style>
<h1>Synthetic credential keyboard</h1>
<div id="status">Ready</div>
<div id="keys"></div>
<script>
// This fixture sends only public geometry, state and pass/fail to the host.
// Input itself is checked here and is never included in an HTTP request.
const digits = location.pathname === '/digits';
const expected = digits ? '902109' : 'aB0! z';
let state = digits ? 'digits' : 'lower';
let entered = '';
const punctuation = Array.from({length: 95}, (_, i) => String.fromCharCode(32 + i))
  .filter(c => !/[a-zA-Z0-9]/.test(c));
function labels() {
  if (digits) return [...'0123456789'];
  return [...(state === 'lower' ? 'abcdefghijklmnopqrstuvwxyz' : 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'),
    ...'0123456789', ...punctuation, 'Shift'];
}
async function render() {
  const keys = labels();
  for (let i = keys.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [keys[i], keys[j]] = [keys[j], keys[i]];
  }
  document.querySelector('#keys').replaceChildren();
  const layout = {bounds: [100, 180, 1020, 300], keys: {}, transitions: {}};
  for (const [i, label] of keys.entries()) {
    const x = 100 + (i % 12) * 85, y = 180 + Math.floor(i / 12) * 50;
    const button = document.createElement('button');
    button.textContent = label === ' ' ? 'Space' : label;
    button.style.left = x + 'px'; button.style.top = y + 'px';
    button.onclick = async () => {
      if (label === 'Shift') state = state === 'lower' ? 'upper' : 'lower';
      else entered += label;
      const passed = entered === expected;
      document.querySelector('#status').textContent = passed ? 'PASS' : 'Input in progress';
      await fetch('/status', {method: 'POST', body: JSON.stringify({passed, state, length: entered.length})});
      render();
    };
    document.querySelector('#keys').append(button);
    layout.keys[label] = [x, y, 80, 45];
  }
  if (!digits) layout.transitions.Shift = state === 'lower' ? 'upper' : 'lower';
  await fetch('/layout', {method: 'POST', body: JSON.stringify({state, layout})});
}
render();
</script>
</html>
